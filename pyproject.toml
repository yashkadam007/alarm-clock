[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-clock"
version = "0.1.0"
description = "Terminal alarm clock with CLI and TUI modes."
requires-python = ">=3.11"
dependencies = [
    "textual>=0.89",
]

[project.scripts]
alarm = "alarm_clock.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
